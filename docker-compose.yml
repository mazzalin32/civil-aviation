# CAA Legal — local & self-hosted stack (hosting-agnostic, PROJECT_SPEC.md §11).
#   Dev:   docker compose up -d          → Postgres + Mailpit; run the app with `npm run dev`
#          add `--profile storage --profile scan` for object storage and ClamAV (needed from Phase 6)
#   Full:  docker compose --profile app up -d --build
name: caa-legal

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caa_legal}
      POSTGRES_USER: ${POSTGRES_USER:-caa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caa_dev_password}
    ports:
      - "${POSTGRES_PORT:-5460}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible private object storage for encrypted documents — not wired up yet.
  # NOTE: MinIO's Docker Hub image now requires a paid login, and pulling the open
  # alternative (chrislusf/seaweedfs) didn't complete in this environment either (network,
  # not a code issue). Phase 6 shipped with encrypted local filesystem storage instead
  # (DOCUMENT_STORAGE_DIR, src/lib/documents/storage.ts) so document upload/download/
  # encryption/scanning all work today; swapping in real object storage later only means
  # rewriting that one file and enabling this service. Off by default until then.
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-caa_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-caa_minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Virus scanning of uploads (Phase 6). First start downloads signatures and takes a few minutes.
  clamav:
    profiles: ["scan"]
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamdata:/var/lib/clamav

  # Dev mail catcher: every email the app sends shows up at http://localhost:8026. Replace with real SMTP in production.
  # Non-default ports — 1025/8025 clash with another local project's Mailpit.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1026}:1025"
      - "8026:8025"

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-caa}:${POSTGRES_PASSWORD:-caa_dev_password}@postgres:5432/${POSTGRES_DB:-caa_legal}
      S3_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
      SMTP_HOST: mailpit
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  clamdata:
